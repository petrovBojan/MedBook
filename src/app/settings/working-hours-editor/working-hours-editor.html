<ng-container *transloco="let t">
  <div class="schedule-table">
    @for (dayGroup of days.controls; track $index) {
      <div class="schedule-row" [formGroup]="dayGroup">
        <mat-checkbox formControlName="enabled" class="day-checkbox">{{
          t('enums.weekday.' + dayGroup.controls.day.value)
        }}</mat-checkbox>

        <mat-form-field appearance="outline" class="time-field">
          <input matInput [matTimepicker]="startPicker" formControlName="start" [placeholder]="t('common.startTime')" />
          <mat-timepicker-toggle matIconSuffix [for]="startPicker" [disabled]="!dayGroup.controls.enabled.value" />
          <mat-timepicker #startPicker interval="15m" />
        </mat-form-field>

        <span class="time-separator">{{ t('common.to') }}</span>

        <mat-form-field appearance="outline" class="time-field">
          <input matInput [matTimepicker]="endPicker" formControlName="end" [placeholder]="t('common.endTime')" />
          <mat-timepicker-toggle matIconSuffix [for]="endPicker" [disabled]="!dayGroup.controls.enabled.value" />
          <mat-timepicker #endPicker interval="15m" />
        </mat-form-field>
      </div>
    }
  </div>
</ng-container>
